name: Render Daily Dashboard

on:
  workflow_dispatch:
    inputs:
      data_file:
        description: "Optional JSON file to render, for example data/2026-07-29.json"
        required: false
        type: string
  push:
    paths:
      - "data/*.json"
      - "data/**/*.json"
      - "schema/**"
      - "dashboard/**"
      - "engine/**"
      - "requirements.txt"
      - ".github/workflows/render-daily.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Validate and render dashboards
        id: render_daily
        shell: bash
        env:
          DATA_FILE: ${{ github.event_name == 'workflow_dispatch' && inputs.data_file || '' }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "$DATA_FILE" ]; then
            files="$DATA_FILE"
          elif [ "$EVENT_NAME" = "push" ]; then
            if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              files="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- 'data/*.json' | sort)"
            else
              files="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- 'data/*.json' | sort)"
            fi
          else
            files="$(find data -maxdepth 1 -name '*.json' | sort | tail -n 1)"
          fi

          if [ -z "$files" ]; then
            echo "No daily JSON files selected for rendering."
            : > /tmp/project-titan-rendered-files.txt
            echo "rendered=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "rendered=true" >> "$GITHUB_OUTPUT"
          : > /tmp/project-titan-rendered-files.txt
          for file in $files; do
            echo "Rendering $file"
            python engine/validate.py "$file"
            python engine/render.py "$file"
            date="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["meta"]["date"])' "$file")"
            printf 'output/png/PROJECT_TITAN_%s.png\n' "$date" >> /tmp/project-titan-rendered-files.txt
            printf 'output/pdf/PROJECT_TITAN_%s.pdf\n' "$date" >> /tmp/project-titan-rendered-files.txt
          done

      - name: Upload rendered outputs
        if: steps.render_daily.outputs.rendered == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: project-titan-rendered-output
          path: |
            output/png/*.png
            output/pdf/*.pdf

      - name: Commit rendered outputs
        if: steps.render_daily.outputs.rendered == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -s /tmp/project-titan-rendered-files.txt ]; then
            xargs git add -- < /tmp/project-titan-rendered-files.txt
          fi

          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Render PROJECT TITAN daily outputs"
            git push
          else
            echo "No rendered output changes to commit."
          fi
